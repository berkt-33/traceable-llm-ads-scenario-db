<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Architecture: deterministic core, LLM proposals, traceability"><title>Architecture: deterministic core, LLM proposals, traceability</title><rect width="960" height="400" fill="#fcfcfb"/><text x="20.0" y="26.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Deterministic core: every decision</text><text x="20.0" y="46.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">accept / reject, duplicate merges, coverage counts</text><rect x="20.0" y="64.0" width="136.0" height="92.0" rx="8" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/><text x="88.0" y="84.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Sources</text><text x="88.0" y="102.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">pinned public sets,</text><text x="88.0" y="117.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">generated corpora;</text><text x="88.0" y="132.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">XOSC and Scenic</text><rect x="174.0" y="64.0" width="136.0" height="92.0" rx="8" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/><text x="242.0" y="84.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Ingest -&gt; IR</text><text x="242.0" y="102.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">declared IR, blobs,</text><text x="242.0" y="117.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">dependencies,</text><text x="242.0" y="132.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">versions</text><line x1="157.0" y1="110.0" x2="165.0" y2="110.0" stroke="#52514e" stroke-width="1.5"/><polygon points="173.0,110.0 165.8,113.5 165.8,106.5" fill="#52514e"/><rect x="328.0" y="64.0" width="136.0" height="92.0" rx="8" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/><text x="396.0" y="84.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Simulate</text><text x="396.0" y="102.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">esmini, Scenic</text><text x="396.0" y="117.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">Newtonian -&gt; trace</text><text x="396.0" y="132.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">-&gt; observed facts</text><line x1="311.0" y1="110.0" x2="319.0" y2="110.0" stroke="#52514e" stroke-width="1.5"/><polygon points="327.0,110.0 319.8,113.5 319.8,106.5" fill="#52514e"/><rect x="482.0" y="64.0" width="136.0" height="92.0" rx="8" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/><text x="550.0" y="84.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Quality gate</text><text x="550.0" y="102.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">L0-L3 rules: accept,</text><text x="550.0" y="117.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">quarantine, reject;</text><text x="550.0" y="132.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">human review</text><line x1="465.0" y1="110.0" x2="473.0" y2="110.0" stroke="#52514e" stroke-width="1.5"/><polygon points="481.0,110.0 473.8,113.5 473.8,106.5" fill="#52514e"/><rect x="636.0" y="64.0" width="136.0" height="92.0" rx="8" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/><text x="704.0" y="84.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Enrich, search</text><text x="704.0" y="102.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">rule tags, captions,</text><text x="704.0" y="117.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">canonical form</text><text x="704.0" y="132.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">(dedup), filters</text><line x1="619.0" y1="110.0" x2="627.0" y2="110.0" stroke="#52514e" stroke-width="1.5"/><polygon points="635.0,110.0 627.8,113.5 627.8,106.5" fill="#52514e"/><rect x="790.0" y="64.0" width="136.0" height="92.0" rx="8" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/><text x="858.0" y="84.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Coverage, selection</text><text x="858.0" y="102.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">catalog predicates,</text><text x="858.0" y="117.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">ODD map, criticality,</text><text x="858.0" y="132.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">campaigns</text><line x1="773.0" y1="110.0" x2="781.0" y2="110.0" stroke="#52514e" stroke-width="1.5"/><polygon points="789.0,110.0 781.8,113.5 781.8,106.5" fill="#52514e"/><text x="178.0" y="242.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">LLM uses: propose,</text><text x="178.0" y="260.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">never decide (P1)</text><text x="178.0" y="278.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">one client: egress by data class,</text><text x="178.0" y="292.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">every call recorded and replayable</text><rect x="20.0" y="220.0" width="136.0" height="82.0" rx="8" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/><text x="88.0" y="240.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Generate</text><text x="88.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">fill closed specs,</text><text x="88.0" y="273.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">write Scenic</text><line x1="88.0" y1="219.0" x2="88.0" y2="166.0" stroke="#eb6834" stroke-width="1.5"/><polygon points="88.0,158.0 91.5,165.2 84.5,165.2" fill="#eb6834"/><text x="94.0" y="186.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">candidate files</text><rect x="482.0" y="220.0" width="136.0" height="82.0" rx="8" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/><text x="550.0" y="240.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Explain, escalate</text><text x="550.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">explain findings (L4),</text><text x="550.0" y="273.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">send to review</text><line x1="550.0" y1="219.0" x2="550.0" y2="166.0" stroke="#eb6834" stroke-width="1.5"/><polygon points="550.0,158.0 553.5,165.2 546.5,165.2" fill="#eb6834"/><text x="556.0" y="186.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">accepted -&gt; quarantined only</text><rect x="636.0" y="220.0" width="136.0" height="82.0" rx="8" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/><text x="704.0" y="240.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Describe, translate</text><text x="704.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">family captions,</text><text x="704.0" y="273.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">query -&gt; filter</text><line x1="704.0" y1="219.0" x2="704.0" y2="166.0" stroke="#eb6834" stroke-width="1.5"/><polygon points="704.0,158.0 707.5,165.2 700.5,165.2" fill="#eb6834"/><text x="710.0" y="186.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">captions, filters</text><rect x="790.0" y="220.0" width="136.0" height="82.0" rx="8" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/><text x="858.0" y="240.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Draft catalog entries</text><text x="858.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">predicates from</text><text x="858.0" y="273.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">protocol text</text><line x1="858.0" y1="219.0" x2="858.0" y2="166.0" stroke="#eb6834" stroke-width="1.5"/><polygon points="858.0,158.0 861.5,165.2 854.5,165.2" fill="#eb6834"/><text x="864.0" y="186.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">drafts,</text><text x="864.0" y="199.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">human sign-off</text><rect x="20" y="330" width="920" height="48" rx="8" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1"/><text x="480.0" y="350.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">Traceability (P3)</text><text x="480.0" y="368.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">content-addressed blob store  ·  hash-chained event log  ·  LLM call log (cache, replay)  ·  dossier per scenario</text></svg>
